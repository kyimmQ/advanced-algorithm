description = "Generates a new timestamped session history file and updates requirements.txt"
prompt = """
Please perform the following maintenance tasks:

1.  **Create History File:**
    -   Generate a new markdown file in the `history/` directory.
    -   Name it `session_YYYYMMDD_HHMM.md` using the current date and time.
    -   Initialize it with this template:
        ```markdown
        # Session Log: {{ date }}

        ## Tasks Completed
        - [ ] 

        ## Strategy Ideas for Next Session
        - 
        ```

2.  **Update Dependencies:**
    -   Run `pip freeze > requirements.txt` (using the active virtual environment) to capture the latest packages.

3.  **Confirm:**
    -   Let me know the name of the new file created.
"""
